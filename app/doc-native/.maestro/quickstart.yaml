appId: com.uplofile.native
---
# Verifies Quick Start opens the document picker through pickFiles
# (adapterReactNativeDocumentsPicker) and can be cancelled.
- launchApp
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: "http://.*:8081"
          index: 0
- assertVisible: "Quick Start"
- tapOn:
    id: "quickstart-trigger"
- assertVisible: "Recents"
- tapOn: "Cancel"
