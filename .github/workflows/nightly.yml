# Catches breakage that PR CI can't see because nothing in the repo changed:
# new advisories against the locked tree, new in-range releases of the
# library's deps (what consumers install), and drift in runners or browsers.
# Named "Nightly", not "CI", so a run never triggers publish.yml.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and unit tests (lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter uplofile typecheck
      - run: pnpm test

  e2e:
    name: E2E tests (lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install chromium --with-deps
        working-directory: app/doc-remix
      - run: pnpm --filter uplofile build
      - run: pnpm --filter doc-remix build
      - run: pnpm --filter doc-remix test:e2e

  fresh-deps:
    name: Library against latest in-range deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Re-resolve the library's deps to the newest versions its semver
      # ranges allow, which is what a fresh `npm install uplofile` gets.
      - run: pnpm --filter uplofile update
      - run: git diff --stat pnpm-lock.yaml
      - run: pnpm --filter uplofile typecheck
      - run: pnpm --filter uplofile test
      - run: pnpm --filter uplofile build

  audit:
    name: Audit library runtime deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit
        run: |
          pnpm audit --prod --json --ignore-registry-errors > audit.json || true
          node .github/scripts/audit-library.mjs < audit.json
