version: 2
updates:
  # Library runtime deps. fix(deps) so merging one ships a patch release.
  - package-ecosystem: npm
    directory: /packages/uplofile
    schedule:
      interval: weekly
    allow:
      - dependency-type: production
    commit-message:
      prefix: "fix(deps)"
    groups:
      library-minor-patch:
        update-types: [minor, patch]

  # Everything else in the workspace (the root entry reads every workspace
  # package.json): library devDeps, root and doc apps. Never released.
  # The library's runtime deps are ignored here so they only come from the
  # entry above, without a duplicate chore(deps) PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@radix-ui/react-slot"
      - dependency-name: "use-sync-external-store"
    commit-message:
      prefix: "chore(deps)"
    groups:
      workspace-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
